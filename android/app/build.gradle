plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Ключ подписи. Лежит вне репозитория — в android/key.properties, который
// на сборочной машине создаётся из секретов GitHub.
//
// Почему это важно: без своего ключа Android подписывает сборку отладочным,
// а он создаётся заново на каждой чистой машине. Значит у каждой сборки своя
// подпись, и новая версия не встанет поверх установленной — телефон ответит
// «приложение не установлено», и обновление превращается в «удалите и
// поставьте заново» для пятисот человек. Со своим ключом подпись одна и та
// же всегда.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

// Для какого канала сборка: `--dart-define=STORE=play` — для Google Play,
// без него — для раздачи файлом с нашего сервера. Одна настройка на обе
// стороны: её же читает Dart (lib/utils/store.dart), и разойтись им нельзя.
// Flutter передаёт dart-define в Gradle списком base64 через запятую.
def dartDefines = [:]
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').split(',').each { entry ->
        def pair = new String(entry.decodeBase64(), 'UTF-8').split('=', 2)
        if (pair.length == 2) dartDefines[pair[0]] = pair[1]
    }
}
def forPlay = dartDefines['STORE'] == 'play'

android {
    namespace "com.example.se_mobile.se_mobile"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'

        // Служба уведомлений чата — только в сборке для своего сервера (см.
        // src/chat/AndroidManifest.xml). Манифест типа сборки подмешивается к
        // основному, а не заменяет его.
        if (!forPlay) {
            debug.manifest.srcFile 'src/chat/AndroidManifest.xml'
            release.manifest.srcFile 'src/chat/AndroidManifest.xml'
        }
    }

    defaultConfig {
        // Google Play не принимает пакеты com.example.*, поэтому в Play своё
        // имя — по домену предприятия, se-btrz.com. Оно навсегда: сменить его
        // в Play после первой публикации нельзя.
        //
        // Сборка для сервера оставляет старое: у пятисот человек приложение
        // стоит под ним, и обновление с другим именем встало бы рядом вторым
        // значком, а не поверх. namespace (пакет кода) от этого не зависит.
        applicationId forPlay ? "com.sebtrz.mobile" : "com.example.se_mobile.se_mobile"
        // Android 7.0 и новее: ниже Flutter 3.47 не собирает. Целевая версия
        // (36) — от Flutter; Google Play требует свежую и каждый год поднимает
        // планку, так что Flutter надо обновлять хотя бы раз в год.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Ключа нет — подписываем отладочным, как раньше: пусть сборка
            // у того, кто просто скачал репозиторий, всё равно получится.
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug

            // R8 выбрасывает из приложения то, что считает неиспользуемым, и
            // определяет это по коду — а то, до чего добираются через
            // отражение (Firebase, хранилище паролей), он не видит и уносит.
            // Правил, которые бы его удержали, здесь никто не писал: release
            // собрали впервые, и первая же сборка не запустилась. Пока
            // выключено; включать — отдельно и с проверкой на телефоне.
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // WebSocket службы уведомлений чата (ChatNotifyService).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // NotificationCompat и ServiceCompat.startForeground с типом службы
    // (Android 14) — не ниже 1.12; прежде приходило только через плагины.
    implementation 'androidx.core:core:1.13.1'
}

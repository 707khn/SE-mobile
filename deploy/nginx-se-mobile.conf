# nginx перед приложением: снимает шифрование и отдаёт запросы gunicorn.
# Сертификат сюда допишет certbot — до него секции listen 443 нет.

# Ограничение частоты попыток входа — по адресу обратившегося.
#
# В приложении замок на учётную запись уже есть, но он про один логин.
# Здесь — про одну машину: перебирать по очереди пять сотен табельных
# номеров с одного адреса тоже не выйдет. Считает nginx, поэтому счёт
# общий на все три процесса приложения, в отличие от памяти внутри них.
limit_req_zone $binary_remote_addr zone=se_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.se-btrz.com;

    # Ответы у нас маленькие (JSON), но со списком из 500 сотрудников
    # разница заметна.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Файл меню из 1С — единственная большая загрузка.
    client_max_body_size 12m;

    # Вход: десять попыток в минуту, короткие всплески пропускаем без
    # задержки — человек мог ошибиться дважды подряд, и ждать он не должен.
    location = /login {
        limit_req zone=se_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Разбор Excel на 500 строк укладывается с запасом.
        proxy_read_timeout 90s;
    }
}

# nginx перед приложением: снимает шифрование и отдаёт запросы gunicorn.
# Сертификат сюда допишет certbot — до него секции listen 443 нет.
#
# ВАЖНО: не копируйте этот файл поверх /etc/nginx/sites-available/se-mobile
# руками — пропадёт секция 443, которую дописал certbot, и приложение у всех
# перестанет входить («Ошибка подключения к серверу»). Правьте рабочий файл
# на месте или запускайте setup.sh: он вернёт сертификат сам.

# Ограничение частоты попыток входа — по адресу обратившегося.
#
# Считать «попытки с одной машины» здесь нельзя: всё предприятие выходит в
# интернет через один NAT, и для nginx пятьсот человек — один адрес. При
# десяти попытках в минуту одиннадцатый вошедший утром в понедельник
# получал бы отказ просто за то, что он одиннадцатый.
#
# От перебора защищает замок на учётную запись: пять неверных паролей — и
# вход по этому логину закрыт с растущей задержкой, сколько бы машин ни
# участвовало. Здесь остаётся грубый предел на случай сорвавшегося скрипта:
# четыре запроса в секунду с адреса — это больше, чем способна набрать
# смена, и меньше, чем нужно для перебора.
limit_req_zone $binary_remote_addr zone=se_login:10m rate=4r/s;

# Загрузки файлов из 1С и Excel: зарплатные листки, сотрудники, меню,
# справочник. Каждая держит одного из трёх рабочих процессов gunicorn до
# полутора минут, и два-три таких запроса подряд кладут приложение для всех
# пятисот человек. Загружают их несколько человек в отделе кадров и в
# столовой, раз в день-неделю, и даже с общего адреса двадцать загрузок
# разом и по одной каждые две секунды после — с большим запасом. А вот
# одновременно с одного адреса — не больше двух: третий процесс остаётся
# остальным, что бы ни делал сорвавшийся скрипт.
limit_req_zone $binary_remote_addr zone=se_upload:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=se_upload_conn:10m;

# Расчётный лист файлом Excel (кнопка «Поделиться»). Собирается питоном на
# каждый запрос; в день выдачи зарплаты им пользуются многие, но не по
# десять раз в секунду.
limit_req_zone $binary_remote_addr zone=se_xlsx:10m rate=2r/s;

# Скачивание сборки приложения. После объявления «вышло обновление»
# качает вся смена с одного адреса, поэтому первые двести скачиваний
# проходят сразу, а дальше — по одному каждые две секунды: пятьсот человек
# обновятся минут за десять. Скорость каждого скачивания и так ограничена
# ниже; здесь — от телефона или скрипта, который качает файл по кругу.
limit_req_zone $binary_remote_addr zone=se_apk:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.se-btrz.com;

    # Ответы у нас маленькие (JSON), но со списком из 500 сотрудников
    # разница заметна.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Файл меню из 1С и прочие загрузки. Расчётные листки — больше, у них
    # свой предел ниже.
    client_max_body_size 12m;

    # Отказ по частоте — 429, как у замка на учётную запись: приложение
    # уже показывает его как «подождите», а не как «сервер сломался».
    limit_req_status 429;
    limit_conn_status 429;
    # Ответ nginx — тем же JSON, что у самого приложения, и со сроком в
    # Retry-After: телефон по нему пишет, через сколько повторить.
    error_page 429 @too_many;
    location @too_many {
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"message": "Failure", "error": "rate_limited", "retry_after": 10}';
    }

    # Всплеск в сотню запросов пропускаем без задержки: утренний вход смены
    # выглядит именно так — все разом, в одну минуту, с одного адреса.
    location = /login {
        limit_req zone=se_login burst=100 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вход на компьютере по QR-коду (qr_login.py): тот же грубый предел,
    # что и на /login, — от скрипта, который заводит коды или перебирает их.
    # Опрос (poll) не ограничиваем: он идёт раз в две секунды с каждого
    # компьютера на экране входа и без секрета компьютера ничего не даёт.
    location ~ ^/api/qr-login/(start|scan|confirm|reject)$ {
        limit_req zone=se_login burst=100 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Собранное приложение. Раздаётся руками пятистам людям, и пока
    # скачивать его было неоткуда, обновлялись единицы — а без этого нельзя
    # включить обязательную проверку пропуска. Отдаёт nginx, а не gunicorn:
    # файл на полсотни мегабайт незачем гонять через питон.
    # Загрузки файлов — см. se_upload выше.
    location ~ ^/api/(admin/upload-payslip-xml|admin/employees/import-excel|menu/import-excel|directory/import-excel)$ {
        limit_req zone=se_upload burst=20 nodelay;
        limit_conn se_upload_conn 2;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Расчётные листки всего предприятия из 1С. Печатная форма, сохранённая
    # в .xls, на 374 человек весит 25 МБ: 1С пишет в неё под 250 колонок
    # оформления. Остальные пределы — те же, что у загрузок выше.
    location = /api/payslips/import-excel {
        client_max_body_size 60m;
        limit_req zone=se_upload burst=20 nodelay;
        limit_conn se_upload_conn 2;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location = /payslip/xlsx {
        limit_req zone=se_xlsx burst=60 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Веб-версия (Safari на iPhone и любой браузер): https://api.se-btrz.com/web/
    # Сборку кладёт сюда deploy/fetch-apk.sh — распакованной, в папку с
    # номером сборки, а current переключается на неё одним движением, так что
    # полуразложенной её никто не увидит.
    #
    # С того же адреса, что и сервер: запросы приложения к /api идут на свой
    # же сайт, и разрешения CORS не нужны вовсе.
    location = /web {
        return 301 /web/;
    }
    location /web/ {
        alias /var/www/se-mobile/web/current/;
        index index.html;
        # Имена файлов у сборки Flutter не меняются от версии к версии
        # (main.dart.js), поэтому браузер переспрашивает каждый раз: не
        # изменилось — короткий ответ 304, вышла новая — сразу новая.
        add_header Cache-Control "no-cache" always;
        # Приложение — несколько мегабайт JavaScript и WebAssembly; сжатые —
        # втрое меньше, а качают их по заводскому каналу и мобильной сети.
        gzip_types application/javascript text/css application/wasm
                   application/json application/manifest+json text/plain;
    }

    # Та же папка видна и через /app/ ниже — веб-версию оттуда не отдаём.
    location ^~ /app/web/ {
        return 404;
    }

    location /app/ {
        alias /var/www/se-mobile/;
        # В имени файла есть «+». В пути адреса это обычный знак, а не
        # пробел — пробелом он значится только в строке запроса, — так что
        # se-mobile-1.9.0+13.apk отдаётся как есть.

        autoindex off;
        # Архив версии для компьютера (SemEng-windows-….zip) — как zip;
        # всё остальное здесь — APK.
        types { application/zip zip; }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
        # Скачивают всей сменой сразу, по заводскому каналу.
        limit_rate_after 8m;
        limit_rate 2m;

        limit_req zone=se_apk burst=200 nodelay;
        # Сборку открывают в браузере телефона: человеку — понятная фраза,
        # а не JSON.
        error_page 429 @apk_busy;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Разбор Excel на 500 строк укладывается с запасом.
        proxy_read_timeout 90s;
    }

    location @apk_busy {
        default_type text/plain;
        charset utf-8;
        add_header Retry-After 60 always;
        return 429 "Сейчас приложение скачивают слишком многие с вашего адреса. Повторите через минуту.\n";
    }
}

# Обновления зависимостей — PR раз в неделю, а не ручной аудит раз в полгода.
# Сервер (pip), приложение (pub) и сами шаги сборки (GitHub Actions).
version: 2
updates:
  - package-ecosystem: pip
    directory: /se-mobile-backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dart-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

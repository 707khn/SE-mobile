name: Build Windows

# Версия для компьютера: тот же код, что у телефона, собранный под Windows.
# Готовый архив ложится в тот же релиз, что и APK этой версии, —
# SemEng-windows-<версия>.zip: распаковать в любую папку и запустить
# SE-mobile.exe. Установка не нужна, права администратора — тоже.
#
# Собирается в составе еженедельного выпуска (release.yml), вместе с APK и
# веб-версией, под тем же номером: раньше Windows собиралась только после
# правки windows/ и отставала от телефона на несколько версий. Отдельно —
# кнопкой «Run workflow».
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - run: flutter pub get --enforce-lockfile

      # Номер версии ставит сборка, а не автор PR: см. .github/scripts/version.sh.
      - name: Версия
        run: bash .github/scripts/version.sh

      # Сборка скачивает Firebase C++ SDK для Windows — большой архив: его
      # тянет firebase_core, хотя на компьютере Firebase не поднимается.
      # Отсюда и лишние минуты.
      - name: Сборка
        run: flutter build windows --release $FLUTTER_VERSION_ARGS

      - name: Упаковать
        shell: pwsh
        run: |
          $pub = $env:PUB
          # Архив пока под прежним именем SemEng-windows: по нему его узнают
          # сервер (app.py) и deploy/fetch-apk.sh на сервере. Переименовывать —
          # только вместе с ними, иначе компьютерам перестанут приезжать версии.
          $name = "SemEng-windows-$pub.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $name
          Get-Item $name | Select-Object Name, Length

      # Установщик: ярлык в «Пуске», установка без прав администратора,
      # новая версия — поверх (windows/installer/SE-mobile.iss). Inno Setup на
      # машине GitHub не стоит — ставим.
      - name: Установщик
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:PUB" windows\installer\SE-mobile.iss
          Get-ChildItem build\installer | Select-Object Name, Length

      # В релиз той же версии, что и APK: v1.25.0-65 для 1.25.0+65. Релиза
      # ещё нет (APK этой версии не собирался) — заводим.
      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${PUB/+/-}"
          FILE="SemEng-windows-$PUB.zip"
          SETUP="build/installer/SE-mobile-setup-$PUB.exe"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" "$SETUP" --clobber
          else
            gh release create "$TAG" "$FILE" "$SETUP" \
              --target "$GITHUB_SHA" --title "SE-mobile $PUB" \
              --notes "Сборка из $GITHUB_SHA. Версия для Windows: SE-mobile-setup — установщик, ZIP — распаковать и запустить SE-mobile.exe."
          fi
          echo "### Windows $PUB: https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

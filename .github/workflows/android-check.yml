name: Android build

# Собирается ли Android-приложение — до слияния, а не после.
#
# Полная сборка с подписью идёт только после попадания в main
# (build-apk.yml). Правки Gradle, плагинов и версий Flutter ломают именно
# сборку, а не код, — и проверки приложения (app-check.yml) этого не видят.
# Здесь — та же сборка для Google Play, только с отладочной подписью: ключа
# в PR нет и не нужно.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-check.yml'
      - '.github/workflows/build-apk.yml'
      - '.github/scripts/check-play-bundle.sh'

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Нужна ли сборка вообще. В pubspec.yaml почти в каждом PR приложения
  # меняется только номер версии, а он сборку сломать не может; ради одной
  # этой строки здесь шли десять минут сборки. За первые двенадцать дней
  # октября проверка съела ~360 минут из 2000 бесплатных в месяц на весь
  # репозиторий — кончатся они, встанут и сборка APK, и присмотр за сервером.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Всё, кроме pubspec.yaml, из списка путей выше.
          other=$(git diff --name-only "$BASE"...HEAD | grep -E \
            '^(android/|pubspec\.lock$|\.github/workflows/(android-check|build-apk)\.yml$|\.github/scripts/check-play-bundle\.sh$)' || true)
          # В pubspec.yaml — всё, кроме строки version:.
          pubspec=$(git diff -U0 "$BASE"...HEAD -- pubspec.yaml \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -vE '^[+-]version:' || true)
          if [ -z "$other" ] && [ -z "$pubspec" ]; then
            echo "Поменялся только номер версии — сборку пропускаем."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # На машине GitHub около 14 ГБ свободного места, а Flutter со своим
      # кэшем, кэш Gradle, NDK и три сборки подряд занимают почти всё — 5
      # октября сборка упала с «No space left on device». Убираем то, что
      # здесь стоит, но нам не нужно: .NET, Haskell, Boost, CodeQL — это
      # больше 10 ГБ. Android SDK и Java не трогаем.
      - name: Освободить место на диске
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-

      - run: flutter pub get

      - name: AAB для Google Play
        run: flutter build appbundle --release --dart-define=STORE=play

      - name: Пропустит ли Google Play
        run: .github/scripts/check-play-bundle.sh build/app/outputs/bundle/release/app-release.aab

      # Сборка выше — без google-services.json, как у того, у кого нет
      # секрета. Эта — с ним: подключение плагина Firebase (app/build.gradle)
      # иначе проверялось бы только после слияния, в build-apk.yml. Настройки
      # выдуманные: собрать они дают, а уведомлений с ними не будет — APK
      # отсюда никуда не идёт.
      - name: Выдуманные настройки Firebase
        run: |
          client() {
            printf '{"client_info":{"mobilesdk_app_id":"1:000000000000:android:%s","android_client_info":{"package_name":"%s"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyA-not-a-real-key-for-ci-000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}' "$1" "$2"
          }
          printf '{"project_info":{"project_number":"000000000000","project_id":"se-mobile-ci","storage_bucket":"se-mobile-ci.appspot.com"},"client":[%s,%s],"configuration_version":"1"}' \
            "$(client 0000000000000001 com.example.se_mobile.se_mobile)" \
            "$(client 0000000000000002 com.sebtrz.mobile)" \
            | jq . > android/app/google-services.json

      # И обычная сборка для раздачи с сервера: у неё старое имя пакета.
      - name: APK для сервера
        run: flutter build apk --release

      - name: Настройки Firebase попали в сборку
        run: |
          RES=$(grep -rl --include='*.xml' 'name="google_app_id"' build/app/generated build/app/intermediates 2>/dev/null | head -1)
          if [ -z "$RES" ]; then
            echo "::error::Плагин google-services не сработал: в ресурсах сборки нет google_app_id"
            exit 1
          fi
          echo "$RES"
          grep 'google_app_id\|project_id' "$RES"

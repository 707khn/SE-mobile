name: Сервер доступен снаружи

# Присмотр со стороны. Сторож на сервере видит только то, что видно с самой
# машины, — и 26 сентября это стоило трёх дней: приложение отвечало на
# 127.0.0.1, а из интернета до него не доходил никто (из nginx пропал HTTPS).
# Узнали от сотрудника. Выключись машина целиком — сторож не написал бы вовсе.
#
# Здесь запрос идёт так же, как с телефона: из интернета, по имени, по HTTPS.
# Не ответил — проверка красная, и GitHub присылает письмо о неудачном
# запуске (тому, кто последним менял расписание в этом файле).
#
# Частую проверку (раз в 1–5 минут) ведёт внешний сервис — UptimeRobot или
# аналог, см. deploy/README.md, «Проверка снаружи»: он бесплатный, сбой
# видно через минуты, а не через час, и сигнал приходит в Telegram сам.
# Здесь остаётся запасная проверка раз в шесть часов и срок сертификата —
# ~120 минут Actions в месяц вместо ~720.
#
# Красный запуск — сигнал в Telegram, если в секретах репозитория заданы
# TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID (те же, что в /etc/se-mobile-alerts.env).
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HOST: api.se-btrz.com
    steps:
      # Три попытки с паузой: одиночный обрыв бывает от чего угодно, и
      # письмо о нём только приучит письма не читать.
      - name: Отвечает ли /health
        run: |
          for attempt in 1 2 3; do
            if answer=$(curl -fsS --max-time 20 "https://$HOST/health" 2>&1); then
              echo "Отвечает: $answer"
              exit 0
            fi
            echo "Попытка $attempt: $answer"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          echo "::error::https://$HOST/health не отвечает снаружи: $answer. Телефоны не могут войти. См. deploy/README.md, «Если телефоны пишут „Ошибка подключения к серверу“»."
          exit 1

      # Certbot продлевает сертификат сам, но продление ломается молча —
      # например, если из конфига nginx пропала его секция. Срок виден
      # снаружи, и за две недели до конца его стоит заметить.
      - name: Срок сертификата
        run: |
          end=$(echo | openssl s_client -servername "$HOST" -connect "$HOST:443" 2>/dev/null \
                | openssl x509 -noout -enddate | cut -d= -f2)
          if [ -z "$end" ]; then
            echo "::error::Не удалось прочитать сертификат $HOST"
            exit 1
          fi
          days=$(( ($(date -d "$end" +%s) - $(date +%s)) / 86400 ))
          echo "Сертификат действует до $end — осталось $days дн."
          if [ "$days" -lt 14 ]; then
            echo "::error::Сертификат $HOST истекает через $days дн. ($end). Продление не сработало: sudo certbot renew --dry-run покажет почему."
            exit 1
          fi

      - name: Сигнал в Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -fsS --max-time 15 -o /dev/null \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ [SE-mobile] https://$HOST не прошёл проверку снаружи: $RUN_URL" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

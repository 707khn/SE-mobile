name: App checks

# Проверка приложения до слияния. Сборка APK запускается только после попадания
# в main — значит, до сих пор код на Dart впервые компилировался уже после
# слияния, и ошибка находилась, когда её было поздно ловить в PR. Здесь только
# то, что быстро и без секретов: компиляция всего lib/ и тесты. Номер версии
# ставит сборка (.github/scripts/version.sh) — сверять больше нечего.
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/app-check.yml'

concurrency:
  group: app-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Компилируется ли всё приложение, а не только то, что тянут тесты.
      # Падаем только на ошибках: старые предупреждения не должны держать PR.
      - name: Код компилируется
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: Проверки приложения
        run: flutter test

name: Build Android APK

# Сборка идёт сама, как только правка попала в main: пока вы читаете письмо
# о слиянии, файл уже собирается. Раньше её запускали руками и стояли над
# ней семь минут — а ждать имеет смысл только то, что нельзя начать заранее.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      emulator:
        description: 'Прогнать проверку на эмуляторе (добавит ~12 минут)'
        type: boolean
        default: false

# Слили два раза подряд — собираем только последнее. Предыдущая сборка уже
# не нужна, а очередь она занимает.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # actions: write — чтобы убирать прежние сборки (шаг ниже).
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # На машине GitHub около 14 ГБ свободного места, а Flutter со своим
      # кэшем, кэш Gradle, NDK и три сборки подряд занимают почти всё — 5
      # октября сборка упала с «No space left on device». Убираем то, что
      # здесь стоит, но нам не нужно: .NET, Haskell, Boost, CodeQL — это
      # больше 10 ГБ. Android SDK и Java не трогаем.
      - name: Освободить место на диске
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      # Gradle заново выкачивает плагин Android, компилятор Kotlin и
      # зависимости при каждой сборке — это минуты. Ключ по файлам сборки:
      # меняются они редко, значит кеш переживает обычную правку экрана.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-

      # Номер версии записан в двух местах: pubspec.yaml и app_version.dart.
      # Второй показывается в «О программе» и уходит на сервер заголовком
      # X-App-Version — по нему в поддержке понимают, какая сборка у человека.
      # Разойдутся — и смотреть будут не на ту версию, а заметить это по
      # экрану нельзя. Пусть замечает сборка, за секунду.
      - name: Версия в двух местах совпадает
        run: |
          PUB=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          DART_V=$(sed -n "s/.*kAppVersion = '\([^']*\)'.*/\1/p" lib/utils/app_version.dart)
          DART_B=$(sed -n "s/.*kAppBuild = '\([^']*\)'.*/\1/p" lib/utils/app_version.dart)
          if [ "$PUB" != "$DART_V+$DART_B" ]; then
            echo "::error::pubspec.yaml: $PUB, app_version.dart: $DART_V+$DART_B. Приведите к одному виду."
            exit 1
          fi
          echo "Версия $PUB"

      - name: Install dependencies
        run: flutter pub get

      # Проверки самого приложения. Их не было вовсе: в test/ лежала заготовка
      # про счётчик из шаблона Flutter, которая не прошла бы и раньше, поэтому
      # запускать их никто и не пробовал. Между тем логика, решающая, что
      # показать человеку на пустом экране, живёт именно здесь.
      - name: Проверки приложения
        run: flutter test

      # Ключ подписи из секретов. Без него Android подписал бы сборку
      # отладочным ключом, а он на чистой машине создаётся заново — у каждой
      # сборки своя подпись, и новая версия не встанет поверх установленной.
      - name: Подготовить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Нет секрета KEYSTORE_BASE64 — подпись будет отладочной, поверх установленной такая сборка не встанет"
            exit 0
          fi

          # Ключ есть, а пароля нет — это не «соберём как-нибудь»: Gradle
          # дойдёт до подписи в самом конце и упадёт через девять минут с
          # «keystore password was incorrect». Пусть падает здесь и по делу.
          MISSING=""
          [ -z "$KEYSTORE_PASSWORD" ] && MISSING="$MISSING KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && MISSING="$MISSING KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && MISSING="$MISSING KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 есть, а этих нет:$MISSING. Добавьте их в Settings → Secrets and variables → Actions, либо уберите KEYSTORE_BASE64, чтобы собирать с отладочной подписью."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android/app/se-mobile.jks

          # Проверяем пароль и псевдоним сразу, пока это стоит секунду.
          if ! keytool -list -keystore android/app/se-mobile.jks \
               -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Хранилище не открывается: не тот пароль (KEYSTORE_PASSWORD) или в нём нет ключа с псевдонимом \"$KEY_ALIAS\" (KEY_ALIAS)."
            exit 1
          fi

          cat > android/key.properties <<PROPS
          storeFile=se-mobile.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "Ключ подписи на месте, хранилище открывается"

      # Все платформы, включая x86_64. Ограничение экономило минуту-две, но
      # на устройстве, которого нет в списке, приложение падает при запуске:
      # своей библиотеки в файле просто нет. Минуты столько не стоят.
      - name: Build APK
        run: flutter build apk --release

      # Чтобы по файлу было видно, чем он подписан: с «своим» ключом сборка
      # встанет поверх прежней, с отладочным — нет.
      - name: Чем подписано
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | grep -i "certificate DN" || true
          else
            echo "apksigner не найден — пропускаю"
          fi
          ls -lh "$APK"

      # Имя с версией — это то, по чему сервер потом узнаёт, какая сборка у
      # него лежит. Отдельного файла с номером версии нет намеренно: номер,
      # который надо где-то повторить, рано или поздно отстаёт. Здесь он
      # переезжает вместе с файлом.
      #
      # Каждый файл выгружается сразу, как собран, а не все в конце: 5 октября
      # на третьей сборке подряд кончилось место на диске, и не сохранился
      # ни один из двух уже готовых.
      - name: Назвать APK версией
        run: |
          PUB=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          cp build/app/outputs/flutter-apk/app-release.apk "se-mobile-$PUB.apk"
          ls -lh "se-mobile-$PUB.apk"

      # Прежние сборки — долой. Хранилище файлов у закрытого репозитория
      # маленькое, а одна сборка весит около 185 МБ (APK, AAB и отладочный
      # APK). 12 октября их накопилось 66, на 4 ГБ, и выгрузка встала:
      # «Artifact storage quota has been hit». Нужна же всегда только
      # последняя — её и раздают. Убираем всё, что выгружено не этим
      # запуском. Не удалилось — не беда: сборка важнее уборки.
      - name: Убрать прежние сборки
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null \
              && echo "удалена сборка $id" || echo "не удалось удалить $id"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: se-mobile-release-apk
          path: se-mobile-*.apk
          retention-days: 7
          overwrite: true

      # Для Google Play — отдельная сборка: своё имя пакета (com.sebtrz.mobile)
      # и без своей проверки обновлений — Play обновляет сам и не разрешает
      # приложению делать это в обход него (lib/utils/store.dart). Play
      # принимает .aab, а не .apk. Подписывается тем же ключом: для Play он —
      # ключ загрузки, окончательную подпись ставит сам Play.
      - name: Build AAB для Google Play
        run: flutter build appbundle --release --dart-define=STORE=play

      - name: Пропустит ли Google Play
        run: .github/scripts/check-play-bundle.sh build/app/outputs/bundle/release/app-release.aab

      - name: Назвать AAB версией
        run: |
          PUB=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          cp build/app/outputs/bundle/release/app-release.aab "se-mobile-play-$PUB.aab"
          ls -lh "se-mobile-play-$PUB.aab"
          df -h / | tail -1

      # Этот файл загружают в Play Console: «Рабочая версия» или
      # «Закрытое тестирование» → «Создать выпуск».
      - name: Upload AAB для Google Play
        uses: actions/upload-artifact@v4
        with:
          name: se-mobile-play-aab
          path: se-mobile-play-*.aab
          retention-days: 30
          overwrite: true

      # Отладочная сборка — последней и необязательной: запасной путь и
      # способ отличить «не работает вообще» от «не работает только release».
      # Если на неё не хватит места, рабочие файлы уже выгружены.
      - name: Build debug APK
        continue-on-error: true
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: se-mobile-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          # Самая тяжёлая (85 МБ) и нужная реже всех: хватит суток.
          retention-days: 1
          overwrite: true

  emulator:
    # Только по отдельной просьбе: проверка на эмуляторе идёт дольше самой
    # сборки, а apk от неё не зависит.
    if: inputs.emulator
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_atd
          arch: x86_64
          profile: Nexus 6
          script: |
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/app_test.dart

      - name: Take screenshot
        if: always()
        run: |
          adb shell screencap -p /sdcard/screen.png
          adb pull /sdcard/screen.png screen.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: screen.png
          retention-days: 3

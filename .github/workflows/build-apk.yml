name: Build Android APK

# Сборка идёт сама, как только правка попала в main: пока вы читаете письмо
# о слиянии, файл уже собирается. Раньше её запускали руками и стояли над
# ней семь минут — а ждать имеет смысл только то, что нельзя начать заранее.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      emulator:
        description: 'Прогнать проверку на эмуляторе (добавит ~12 минут)'
        type: boolean
        default: false

# Слили два раза подряд — собираем только последнее. Предыдущая сборка уже
# не нужна, а очередь она занимает.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # Gradle заново выкачивает плагин Android, компилятор Kotlin и
      # зависимости при каждой сборке — это минуты. Ключ по файлам сборки:
      # меняются они редко, значит кеш переживает обычную правку экрана.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: flutter pub get

      # android-arm и android-arm64 — все телефоны предприятия. Третья
      # платформа, x86_64, нужна только эмулятору, а машинный код под неё
      # собирается столько же, сколько под настоящую.
      - name: Build APK
        run: flutter build apk --debug --target-platform android-arm,android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: se-mobile-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          overwrite: true

  emulator:
    # Только по отдельной просьбе: проверка на эмуляторе идёт дольше самой
    # сборки, а apk от неё не зависит.
    if: inputs.emulator
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_atd
          arch: x86_64
          profile: Nexus 6
          script: |
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/app_test.dart

      - name: Take screenshot
        if: always()
        run: |
          adb shell screencap -p /sdcard/screen.png
          adb pull /sdcard/screen.png screen.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: screen.png
          retention-days: 3

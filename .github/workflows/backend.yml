name: Проверки сервера

# Их не запускал никто, кроме человека, который их писал. Сто двадцать пять
# проверок сервера — того самого, от которого зависят сто тридцать человек, —
# существовали и молчали: сломай кто-нибудь вход или права, узнали бы об этом
# на боевом сервере.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'se-mobile-backend/**'
      # Сторож и setup.sh лежат здесь, а проверяются серверными тестами
      # (test_watchdog.py): правка одного скрипта тоже должна их запускать.
      - 'deploy/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'se-mobile-backend/**'
      # Сторож и setup.sh лежат здесь, а проверяются серверными тестами
      # (test_watchdog.py): правка одного скрипта тоже должна их запускать.
      - 'deploy/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04

    # Дважды: на SQLite и на настоящем PostgreSQL.
    #
    # Это не перестраховка. SQLite прощает то, чего PostgreSQL не прощает:
    # длину строковых колонок он не проверяет вовсе, а внешние ключи по
    # умолчанию не ведёт. На обоих здесь уже обжигались на боевом сервере — на
    # длине колонки и на auth_tokens при склейке сотрудников, — и в обоих
    # случаях проверки на SQLite были зелёными.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SQLite
            database_url: ''
          - name: PostgreSQL 16
            database_url: 'postgresql://postgres:postgres@localhost:5432/se_mobile_test'

    name: ${{ matrix.name }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: se_mobile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            se-mobile-backend/requirements.txt
            se-mobile-backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: se-mobile-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Пределы частоты в deploy/nginx-se-mobile.conf проверяются на
      # настоящем nginx (test_nginx_limits.py) — той же версии, что на
      # сервере с Ubuntu 24.04.
      - name: Install nginx
        run: |
          # Нам нужен только nginx из Ubuntu. Сторонний репозиторий Microsoft,
          # прописанный в образе GitHub, иногда отвечает 403, и apt-get update
          # валит весь прогон ещё до проверок. Его список убираем.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends nginx-core

      - name: pytest
        working-directory: se-mobile-backend
        env:
          # Пусто — conftest возьмёт SQLite в памяти.
          DATABASE_URL: ${{ matrix.database_url }}
        run: pytest tests/ -q

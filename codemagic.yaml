workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    environment:
      flutter: 3.24.5

    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Build debug APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

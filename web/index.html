<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    Адрес, с которого раздаётся приложение: /web/ на api.se-btrz.com.
    Подставляет `flutter build web --base-href /web/`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!--
    Без этого iPhone рисует заставку на ширину 980 точек и ужимает её до
    экрана: логотип и колечко выходили в два с половиной раза мельче. Когда
    поднимется приложение, Flutter поставит свою такую же строку.
  -->
  <!--
    viewport-fit=cover: без него Safari не сообщает размер «безопасной зоны»
    (env(safe-area-inset-*) = 0), а на iPhone со значка экрана «Домой»
    страница всё равно доходит до самого низа — полоска «домой» ложилась на
    подписи нижней панели, а скруглённые углы срезали её края. С ним отступы
    известны, и приложение само отодвигает панель (см. web_safe_area.dart).
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SE-mobile — приложение сотрудников Semey Engineering">

  <!--
    iPhone: «Поделиться» → «На экран Домой» ставит приложение значком и
    открывает его без строки адреса, как обычное. Полоса сверху — светлая,
    как у самого приложения, и при стиле default страница начинается под
    ней. Если же браузер всё-таки пустит страницу под часы и вырез, это
    придёт отступом сверху safe-area-inset-top, и заголовок сдвинется.
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SE-mobile">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#018041">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SE-mobile</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #018041; }
    /* Пока грузится приложение (несколько мегабайт по заводскому каналу) —
       зелёный экран с логотипом, как у заставки на телефоне, а не белый. */
    /* Крупно: на iPhone 96 точек логотипа и тонкое колечко едва читались. */
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 40px;
      font: 17px -apple-system, system-ui, sans-serif; color: #fff;
    }
    #loading img {
      width: min(55vw, 220px); height: auto; filter: brightness(0) invert(1);
    }
    #loading .spin {
      width: 48px; height: 48px; border-radius: 50%; box-sizing: border-box;
      border: 5px solid rgba(255,255,255,.35); border-top-color: #fff;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/logo.png" alt="">
    <div class="spin"></div>
  </div>
  <noscript>Для работы SE-mobile включите JavaScript в настройках браузера.</noscript>
  <!-- Щуп безопасной зоны: его отступы — это env(safe-area-inset-*). -->
  <div id="safe-area-probe" style="position: fixed; left: 0; top: 0;
       visibility: hidden; pointer-events: none;
       padding: env(safe-area-inset-top) env(safe-area-inset-right)
                env(safe-area-inset-bottom) env(safe-area-inset-left);"></div>
  <script>
    // Flutter при запуске убирает нашу строку viewport и ставит свою — уже
    // без viewport-fit=cover. Возвращаем его в любую такую строку.
    (function () {
      function cover() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (m) {
          var c = m.getAttribute('content') || '';
          if (c.indexOf('viewport-fit') < 0) {
            m.setAttribute('content', c + ', viewport-fit=cover');
          }
        });
      }
      new MutationObserver(cover).observe(document.head, {
        childList: true, attributes: true, subtree: true,
        attributeFilter: ['content'],
      });
    })();

    // Отступы безопасной зоны в логических точках: [сверху, справа, снизу,
    // слева]. Читает web_safe_area.dart; Flutter в браузере их не знает
    // (MediaQuery.padding там всегда нули).
    window.seSafeAreaInsets = function () {
      var el = document.getElementById('safe-area-probe');
      if (!el) return [0, 0, 0, 0];
      var s = getComputedStyle(el);
      return [s.paddingTop, s.paddingRight, s.paddingBottom, s.paddingLeft]
        .map(function (v) { return parseFloat(v) || 0; });
    };

    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
